[build-system]
requires = ["setuptools>=70.0.0", "wheel", "setuptools_scm[toml]>=6"]
build-backend = "setuptools.build_meta"

[project]
name = "attackbenchlib"
version = "1.0.6"
description = "A Python package for benchmarking adversarial attacks and defenses."
authors = [
    { name = "Antonio Cinà", email="antonio.cina@unige.it"},
    { name = "Riccardo Trebiani", email = "richitrebbia@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Relaxed constraints to allow using pre-installed PyTorch versions (e.g., on Colab)
    # This prevents downgrading to CPU-only versions or breaking GPU support.
    "torch>=2.4",
    "torchvision>=0.19",
    "matplotlib>=3.5.1",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "numpy>=1.21.0",  # Removed upper bound <1.27.0 to support Numpy 2.0+ on modern environments
    "tqdm>=4.56.2",
    "wget>=3.2",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
# Attack package - enables all adversarial attack libraries (except deeprobust)
attacks = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "torchattacks",
    "cleverhans==4.0.0",
    # Note: 'adv-lib' is removed as it is not on PyPI. Users must install it manually via git.
    # Note: robustbench is NOT needed here — attacks don't depend on it.
    #       It belongs in [models] for loading pretrained robust models.
]

# DeepRobust attacks (requires scipy<1.8.0, incompatible with Python 3.10+)
# Only install this on Python 3.9 with: pip install -e ".[deeprobust]"
deeprobust = [
    "deeprobust",
    "scipy>=1.5.0,<1.8.0",
]

# Models & datasets — always needed together to run attacks
models = [
    "pillow>=8.0.0",
    "requests>=2.25.0",
    "timm>=0.9.0",
    "transformers>=4.20.0",
    "robustbench>=1.1",
    "pyautoattack>=0.2.0",  # Required by robustbench (provides the 'autoattack' module)
    "pretrainedmodels>=0.7.4",
]

# Metrics package - enables results analysis and evaluation
metrics = [
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "tabulate>=0.9.0",
]

# Complete package - includes all optional dependencies (except deeprobust)
all = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "torchattacks",
    "cleverhans==4.0.0",
    "robustbench>=1.1",
    "pyautoattack>=0.2.0",
    "timm>=0.9.0",
    "transformers>=4.20.0",
    "pretrainedmodels>=0.7.4",
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "tabulate>=0.9.0",
    "pillow>=8.0.0",
    "requests>=2.25.0",
    # Note: 'adv-lib' is excluded here too.
]

# Development package
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

# Documentation package
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attackbench*"]

[project.scripts]
run_attack = "attackbench.run:main"
wandb_manager = "attackbench.wandb.manager:main"