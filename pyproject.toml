[build-system]
requires = ["setuptools>=70.0.0", "wheel", "setuptools_scm[toml]>=6"]
build-backend = "setuptools.build_meta"

[project]
name = "attackbenchlib"
version = "2.0.0"
description = "A Python package for benchmarking adversarial attacks and defenses."
authors = [
    { name = "Antonio Cinà", email="antonio.cina@unige.it"},
    { name = "Riccardo Trebiani", email = "richitrebbia@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
# No upper bound: the <3.13 cap made the package uninstallable on current Python
# releases. It came from the [deeprobust] extra (scipy<1.8, Python 3.9 only), which is
# an optional extra and pins itself.
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Relaxed constraints to allow using pre-installed PyTorch versions (e.g., on Colab)
    # This prevents downgrading to CPU-only versions or breaking GPU support.
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.21.0",  # Removed upper bound <1.27.0 to support Numpy 2.0+ on modern environments
    "tqdm>=4.56.2",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
# Attack package - enables all adversarial attack libraries (except deeprobust)
attacks = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "torchattacks",
    "cleverhans==4.0.0",
    # Note: robustbench is NOT needed here — attacks don't depend on it.
    #       It belongs in [models] for loading pretrained robust models.
]

# AdvLib is not on PyPI, but its implementations are among the top-ranked ones in the
# AttackBench paper — installing without it leaves you with the weaker re-implementations.
adv_lib = [
    "adv-lib @ git+https://github.com/jeromerony/adversarial-library",
]

# DeepRobust attacks (requires scipy<1.8.0, incompatible with Python 3.10+)
# Only install this on Python 3.9 with: pip install -e ".[deeprobust]"
deeprobust = [
    "deeprobust",
    "scipy>=1.5.0,<1.8.0",
]

# Models & datasets — always needed together to run attacks
# (timm/transformers/pretrainedmodels are pulled in by robustbench itself when a model
#  needs them; AttackBench does not import them.)
models = [
    "pillow>=8.0.0",
    "robustbench>=1.1",
    "pyautoattack>=0.2.0",  # Required by robustbench (provides the 'autoattack' module)
]

# Metrics package - enables results analysis and evaluation.
# The analysis code only needs numpy, which is a core dependency; the extra is kept so
# `pip install attackbenchlib[metrics]` stays valid.
metrics = []

# Complete package - includes all optional dependencies (except deeprobust and adv_lib,
# which needs a git checkout)
all = [
    "attackbenchlib[attacks,models,metrics]",
]

# Development package
dev = [
    "pytest>=7.0",  # 7.0 for [tool.pytest.ini_options] pythonpath
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

# Documentation package
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attackbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # run the suite from a checkout without installing first