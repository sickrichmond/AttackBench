[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "attackbench"
version = "1.0.0"
description = "A Python package for benchmarking adversarial attacks and defenses."
authors = [
    { name = "Antonio Cinà", email="antonio.cina@unige.it"},
    { name = "Riccardo Trebiani", email = "richitrebbia@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9,<3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch==1.12.1",
    "torchvision==0.13.1",
    "matplotlib==3.5.1",
    "pandas==1.3.5",
    "scipy<1.8.0",
    "tqdm==4.56.2",
    "wget==3.2",
]

[project.optional-dependencies]
# Attack package - enables all adversarial attack libraries
attacks = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "deeprobust",
    "torchattacks",
    "cleverhans==4.0.0",
    "robustbench @ git+https://github.com/RobustBench/robustbench.git",
    "adv-lib @ git+https://github.com/jeromerony/adversarial-library.git",
]

# Dataset package - enables loading of additional datasets
datasets = [
    "pillow>=8.0.0",
    "requests>=2.25.0",
]

# Model package - enables loading of pre-trained models
models = [
    "timm>=0.9.0",
    "transformers>=4.20.0",
    "robustbench @ git+https://github.com/RobustBench/robustbench.git",
    "pretrainedmodels>=0.7.4",
]

# Metrics package - enables results analysis and evaluation
metrics = [
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "tabulate>=0.9.0",
]

# Complete package - includes all optional dependencies
all = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "deeprobust",
    "torchattacks", 
    "cleverhans==4.0.0",
    "robustbench @ git+https://github.com/RobustBench/robustbench.git",
    "adv-lib @ git+https://github.com/jeromerony/adversarial-library.git",
    "timm>=0.9.0",
    "transformers>=4.20.0",
    "pretrainedmodels>=0.7.4", 
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "tabulate>=0.9.0",
    "pillow>=8.0.0",
    "requests>=2.25.0",
]

# Development package
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.0", 
    "flake8>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attack_evaluation*", "analysis*"]

[project.scripts]
atkbench = "attack_evaluation.run:main"

