[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackbenchlib"
version = "2.0.0"
description = "A Python package for benchmarking adversarial attacks and defenses."
authors = [
    { name = "Antonio Cinà", email="antonio.cina@unige.it"},
    { name = "Riccardo Trebiani", email = "richitrebbia@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
# No upper bound: the <3.13 cap made the package uninstallable on current Python
# releases. It came from the [deeprobust] extra (scipy<1.8, Python 3.9 only), which is
# an optional extra and pins itself.
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Relaxed constraints to allow using pre-installed PyTorch versions (e.g., on Colab)
    # This prevents downgrading to CPU-only versions or breaking GPU support.
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.21.0",  # Removed upper bound <1.27.0 to support Numpy 2.0+ on modern environments
    "tqdm>=4.56.2",
    "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://attackbench.github.io/"
Documentation = "https://attackbench.readthedocs.io/en/latest/"
Repository = "https://github.com/attackbench/AttackBench"
Issues = "https://github.com/attackbench/AttackBench/issues"
Paper = "https://doi.org/10.1609/aaai.v39i3.32263"
Changelog = "https://github.com/attackbench/AttackBench/blob/main/CHANGELOG.md"

[project.scripts]
attackbench-acceptance = "attackbench.acceptance:main"

[project.optional-dependencies]
# Attack package - enables PyPI-hosted attack libraries (except deeprobust).
# adv-lib is installed manually from its source repository; see the README.
attacks = [
    "adversarial-robustness-toolbox",
    "foolbox",
    "torchattacks",
    "cleverhans==4.0.0",
    # Note: robustbench is NOT needed here — attacks don't depend on it.
    #       It belongs in [models] for loading pretrained robust models.
]

# DeepRobust attacks (requires scipy<1.8.0, incompatible with Python 3.10+)
# Only install this on Python 3.9 with: pip install -e ".[deeprobust]"
deeprobust = [
    "deeprobust",
    "scipy>=1.5.0,<1.8.0",
]

# Models & datasets — always needed together to run attacks
# (timm/transformers/pretrainedmodels are pulled in by robustbench itself when a model
#  needs them; AttackBench does not import them.)
models = [
    "pillow>=8.0.0",
    "robustbench>=1.1",
    # GeoTorch 0.4 raises the PyTorch floor to 2.6; 0.3 is what RobustBench 1.1
    # was designed around and preserves AttackBench's declared torch>=2.4 floor.
    "geotorch<0.4",
    # RobustBench 1.1.1 still imports pkg_resources, removed in setuptools 81.
    "setuptools<81",
]

# Metrics package - enables results analysis and evaluation.
# The analysis code only needs numpy, which is a core dependency; the extra is kept so
# `pip install attackbenchlib[metrics]` stays valid.
metrics = []

# Complete package - includes all PyPI-hosted optional dependencies (except deeprobust).
# adv-lib must be installed manually from its source repository; see the README.
all = [
    "attackbenchlib[attacks,models,metrics]",
]

# Development package
dev = [
    "pytest>=7.0",  # 7.0 for [tool.pytest.ini_options] pythonpath
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

# Documentation package
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attackbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # run the suite from a checkout without installing first