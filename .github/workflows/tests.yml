name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# a new push supersedes the runs still queued for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor declared in pyproject and the current releases;
        # torch ships wheels up to 2.8 for 3.9 and 2.13 for 3.10+
        python: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install torch (CPU wheels)
        # from the CPU index, otherwise pip pulls the CUDA build (~2.5 GB) that the
        # runner cannot use anyway
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install the package
        run: pip install -e ".[metrics]" pytest

      - name: Run the test suite
        run: pytest

  registry:
    # The suite skips the registry sweep when the attack libraries are absent, and that
    # sweep is what checks that everything list_attacks() advertises can actually be
    # built for the norm it is listed under.
    name: attack registry (with the attack libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install torch (CPU wheels)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install the package with the attack libraries
        run: pip install -e ".[attacks,metrics]" pytest

      - name: Run the test suite
        run: pytest

      - name: Fail if the registry sweep was skipped
        run: pytest tests/test_public_api.py::test_registry_lists_attacks_when_the_libraries_are_installed -q --no-header -rN | grep -q "1 passed"

  docs:
    name: docs build (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        # conf.py mocks torch and the attack libraries, so the build needs neither
        run: pip install -r docs/requirements.txt

      - name: Build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
